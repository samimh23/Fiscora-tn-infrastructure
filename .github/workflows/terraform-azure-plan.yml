name: Terraform Azure staging plan

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "azure/**"
      - ".github/workflows/terraform-azure-plan.yml"

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-azure-staging-plan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: Plan Azure staging
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_VAR_azure_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_operator_object_id: ${{ vars.AZURE_OPERATOR_OBJECT_ID }}
      TF_VAR_deployment_suffix: ${{ vars.AZURE_DEPLOYMENT_SUFFIX }}
      TF_VAR_budget_contact_emails: '["${{ vars.AZURE_BUDGET_EMAIL }}"]'
      TF_VAR_smtp_user: ${{ vars.BREVO_SMTP_LOGIN }}
      TF_VAR_deploy_application: "false"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Authenticate to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_TERRAFORM_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.2

      - name: Initialize Azure state
        working-directory: azure/environments/staging
        run: >-
          terraform init
          -backend-config="resource_group_name=${{ vars.AZURE_TF_STATE_RESOURCE_GROUP }}"
          -backend-config="storage_account_name=${{ vars.AZURE_TF_STATE_STORAGE_ACCOUNT }}"
          -backend-config="container_name=tfstate"
          -backend-config="key=azure/staging.tfstate"
          -backend-config="use_azuread_auth=true"

      - name: Create Azure staging plan
        working-directory: azure/environments/staging
        run: terraform plan -lock-timeout=60s -no-color
