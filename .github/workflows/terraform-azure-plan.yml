name: Terraform Azure staging plan

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-azure-staging-plan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: Plan Azure staging
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Load the complete staging configuration
        working-directory: azure/environments/staging
        shell: bash
        env:
          STAGING_TFVARS: ${{ secrets.AZURE_TERRAFORM_TFVARS }}
        run: |
          if [ -z "$STAGING_TFVARS" ]; then
            echo "Set AZURE_TERRAFORM_TFVARS to the reviewed staging settings; never put passwords or API keys in it." >&2
            exit 1
          fi
          umask 077
          printf '%s\n' "$STAGING_TFVARS" > terraform.tfvars

      - name: Authenticate to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_TERRAFORM_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.2

      - name: Initialize Azure state
        working-directory: azure/environments/staging
        run: >-
          terraform init
          -backend-config="resource_group_name=${{ vars.AZURE_TF_STATE_RESOURCE_GROUP }}"
          -backend-config="storage_account_name=${{ vars.AZURE_TF_STATE_STORAGE_ACCOUNT }}"
          -backend-config="container_name=tfstate"
          -backend-config="key=azure/staging.tfstate"
          -backend-config="use_azuread_auth=true"

      - name: Create Azure staging plan
        working-directory: azure/environments/staging
        shell: bash
        run: |
          set +e
          # Existing-state comparison: this identity cannot read Key Vault values
          # or refresh Entra applications. Use the local operator for drift checks.
          terraform plan -refresh=false -lock-timeout=60s -input=false -no-color -detailed-exitcode
          result=$?
          set -e
          if [ "$result" -eq 2 ]; then
            echo "Changes proposed. This workflow never applies them." >> "$GITHUB_STEP_SUMMARY"
          elif [ "$result" -ne 0 ]; then
            exit "$result"
          else
            echo "No infrastructure changes proposed." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Remove temporary configuration
        if: always()
        working-directory: azure/environments/staging
        run: rm -f terraform.tfvars
