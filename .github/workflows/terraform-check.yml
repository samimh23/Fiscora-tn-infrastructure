name: Terraform checks

on:
  pull_request:
    paths:
      - "**/*.tf"
      - "**/*.tftest.hcl"
      - "**/*.tfvars.example"
      - ".github/workflows/**"
      - "scripts/**"
  push:
    branches:
      - main
    paths:
      - "**/*.tf"
      - "**/*.tftest.hcl"
      - "**/*.tfvars.example"
      - ".github/workflows/**"
      - "scripts/**"

permissions:
  contents: read

jobs:
  validate:
    name: Format and validate
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Node.js for workflow guard tests
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check deployment workflow guards
        run: node --test scripts/*.test.cjs

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.2

      - name: Check formatting
        run: terraform fmt -check -recursive

      - name: Initialize Azure state bootstrap
        working-directory: azure/bootstrap
        run: terraform init -backend=false -input=false

      - name: Validate Azure state bootstrap
        working-directory: azure/bootstrap
        run: terraform validate

      - name: Initialize Azure staging
        working-directory: azure/environments/staging
        run: terraform init -backend=false -input=false

      - name: Validate Azure staging
        working-directory: azure/environments/staging
        run: terraform validate

      - name: Test simplified Azure layout without cloud access
        working-directory: azure/environments/staging
        run: terraform test

      - name: Initialize mocked application tests
        working-directory: azure/modules/application
        run: terraform init -backend=false -input=false

      - name: Test deployment ownership without cloud access
        working-directory: azure/modules/application
        run: terraform test

      - name: Initialize Google Cloud state bootstrap
        working-directory: gcp/bootstrap
        run: terraform init -backend=false -input=false

      - name: Validate Google Cloud state bootstrap
        working-directory: gcp/bootstrap
        run: terraform validate

      - name: Initialize Google Cloud AI staging
        working-directory: gcp/environments/ai-staging
        run: terraform init -backend=false -input=false

      - name: Validate Google Cloud AI staging
        working-directory: gcp/environments/ai-staging
        run: terraform validate
