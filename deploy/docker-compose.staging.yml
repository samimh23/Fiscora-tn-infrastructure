name: fiscora-staging

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: accounting_nest
      POSTGRES_USER: accounting
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U accounting -d accounting_nest"]
      interval: 5s
      timeout: 5s
      retries: 20
    mem_limit: 384m

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: server /data
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - minio_data:/data
    mem_limit: 256m

  api:
    image: ${BACKEND_IMAGE}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      CORS_ALLOWED_ORIGINS: https://app.fiscora.me
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: accounting
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: accounting_nest
      DB_MIGRATIONS_RUN: "true"
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY}
      JWT_ISSUER: fiscora
      JWT_AUDIENCE: fiscora-api
      JWT_ACCESS_MINUTES: 30
      JWT_REFRESH_DAYS: 14
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      MINIO_PUBLIC_ENDPOINT: app.fiscora.me
      MINIO_PUBLIC_PORT: 443
      MINIO_PUBLIC_USE_SSL: "true"
      MINIO_REGION: eu-north-1
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: accounting-documents
      MALWARE_SCAN_ENABLED: "false"
      APP_PUBLIC_URL: https://app.fiscora.me
      INVITATION_EXPOSE_LINK: "${INVITATION_EXPOSE_LINK:-true}"
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_SECURE: "${SMTP_SECURE:-false}"
      SMTP_USER: "${SMTP_USER:-}"
      SMTP_PASSWORD: "${SMTP_PASSWORD:-}"
      SMTP_FROM: "${SMTP_FROM:-Fiscora <invitations@fiscora.me>}"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    mem_limit: 640m

  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./web:/srv:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
    mem_limit: 128m

volumes:
  postgres_data:
  minio_data:
  caddy_data:
  caddy_config:
